[project]
name = "investor-sourcing"
version = "0.1.0"
description = "Screen employees of competitor funds and surface the European/Israeli companies they follow"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
investor-sourcing = "investor_sourcing.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
